[project]
name = "medical-nl2sql-agent"
version = "0.1.0"
description = "Medical NL2SQL agent with clarification loop, schema knowledge, and evaluation"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "langchain-deepseek",
    "openai",
    "sqlglot",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
